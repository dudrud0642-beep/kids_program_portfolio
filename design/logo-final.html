<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모아놀자 로고 미리보기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: var(--bg); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 40px 24px 56px; }
    .head h1 { font-size: 26px; font-weight: 700; }
    .head p { margin-top: 6px; color: var(--text-3); }
    .hero { display: grid; place-items: center; gap: 20px; margin-top: 24px; padding: 56px 24px; border-radius: 22px; background: #fff; box-shadow: var(--shadow); }
    .big .logo-mark { width: 120px; height: 120px; }
    .big .logo-word { font-size: 84px; }
    .big.brand-link { gap: 14px; cursor: default; }
    .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
    .tile { display: grid; place-items: center; min-height: 120px; padding: 20px; border-radius: 18px; background: #fff; box-shadow: var(--shadow); }
    .tile.dark { background: #1f2937; }
    .tile.dark .logo-word { color: #a99dff; }
    .tile.dark .logo-word b { color: #fff; }
    .tile.dark .logo-sub { color: #c7cdd8; }
    .note { margin-top: 16px; padding: 18px 20px; border-radius: 16px; background: #fff; box-shadow: var(--shadow); font-size: 14.5px; color: var(--text-2); }
    .note b { color: var(--text); }
    @media (max-width: 700px) {
      .row { grid-template-columns: minmax(0, 1fr); }
      .big .logo-mark { width: 72px; height: 72px; }
      .big .logo-word { font-size: 50px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>모아놀자 로고 미리보기</h1>
      <p><span class="sent">노란 블록이 왼쪽에서 <span class="nw">통통통 굴러와</span> 맨 위에 안착하고, <span class="nw">도착하면 웃어요.</span></span><span class="sent">사이트에서는 처음 열 때 한 번, <span class="nw">로고에 마우스를 올릴 때마다</span> 다시 움직여요.</span></p>
    </div>

    <div class="hero">
      <span class="brand-link big" id="big-logo">
        <svg class="logo-mark is-playing" viewBox="0 0 40 40" aria-hidden="true">
          <g class="lm-base"><rect x="4" y="21" width="15" height="15" rx="3.5" fill="#3d9bff"/><rect x="21" y="21" width="15" height="15" rx="3.5" fill="#ff5c8a"/></g>
          <g class="lm-drop"><g transform="rotate(-8 20 12.5)"><rect x="12.5" y="5" width="15" height="15" rx="3.5" fill="#ffc233"/>
            <g class="lm-face"><circle cx="17.4" cy="11.4" r="1.3" fill="#1f2937"/><circle cx="22.6" cy="11.4" r="1.3" fill="#1f2937"/><path d="M17.6 14.6q2.4 2 4.8 0" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/></g>
          </g></g>
        </svg>
        <span class="logo-word"><b>모아</b>놀자</span>
      </span>
      <button class="btn btn-primary" type="button" id="replay">다시 보기</button>
    </div>

    <div class="row" id="tiles"></div>

    <p class="note"><b>이름 뜻</b> · 구청·도서관·문화재단에 흩어진 프로그램을 <span class="nw">한곳에 "모아"</span> 보여 주고, 그걸 보고 <span class="nw">아이랑 "놀자"는</span> 뜻이에요. 블록 세 개를 <span class="nw">쌓아 모으는 그림이</span> 이름과 이어져요.</p>
  </div>

  <script>
    // 같은 로고를 작은 크기·어두운 배경에서도 보여 준다
    const big = document.getElementById('big-logo');
    const tiles = document.getElementById('tiles');
    const make = (dark, withSub, size) => {
      const t = document.createElement('div');
      t.className = 'tile' + (dark ? ' dark' : '');
      const mark = big.querySelector('svg').outerHTML;
      t.innerHTML = `<span class="brand-link"${size ? ` style="--s:${size}"` : ''}>${mark}<span class="logo-text"><span class="logo-word"><b>모아</b>놀자</span>${withSub ? '<span class="logo-sub">우리 동네 아이랑 프로그램</span>' : ''}</span></span>`;
      tiles.appendChild(t);
    };
    make(false, true); make(true, true); make(false, false);
    // 다시 보기: 모든 로고의 애니메이션을 처음부터
    document.getElementById('replay').addEventListener('click', () => {
      document.querySelectorAll('.logo-mark').forEach((m) => { m.classList.remove('is-playing'); void m.getBoundingClientRect(); m.classList.add('is-playing'); });
    });
  </script>
</body>
</html>
